<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Écran / dé arrondi -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#shine)"/>
  <!-- Bouton lecture -->
  <path d="M50 38 L92 64 L50 90 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
  <!-- Points de dé, aux couleurs des séries -->
  <circle cx="30" cy="30" r="8" fill="#facc15"/>
  <circle cx="98" cy="30" r="8" fill="#ef4444"/>
  <circle cx="30" cy="98" r="8" fill="#22c55e"/>
  <circle cx="98" cy="98" r="8" fill="#3b82f6"/>
</svg>
