<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>RandomWatch – video</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { background: #09090b; color: #fafafa; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
      #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #09090b; }
      .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
      .grain {
        position: absolute; inset: 0; opacity: 0.5;
        background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 22px 22px;
      }
      .layer { position: absolute; will-change: opacity, transform; }
      .brand { display: flex; align-items: center; gap: 14px; }
      .brand img { filter: drop-shadow(0 0 18px rgba(217, 70, 239, 0.6)); }
      .brand span { font-weight: 700; letter-spacing: -0.02em; }
      h1 { font-weight: 800; letter-spacing: -0.035em; line-height: 1.04; }
      em {
        font-style: normal;
        background: linear-gradient(90deg, #e879f9, #818cf8);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      p.sub { color: #a1a1aa; line-height: 1.5; font-size: 22px; }
      .kicker {
        display: inline-flex; gap: 8px; align-items: center; padding: 6px 14px; border-radius: 999px; align-self: flex-start;
        background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 15px; font-weight: 600; color: #e4e4e7;
      }
      .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
      .frame {
        position: absolute; overflow: hidden; border-radius: 22px; background: #09090b;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.9), 0 0 70px -10px rgba(217, 70, 239, 0.45);
      }
      .frame iframe { position: absolute; left: 0; top: 0; border: 0; display: block; transform-origin: 0 0; background: #09090b; }
      .ripple { position: absolute; border-radius: 50%; border: 3px solid #fff; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      const lang = new URLSearchParams(location.search).get('lang') || 'en';
      const COLORS = ['#facc15', '#ef4444', '#22c55e', '#3b82f6'];
      const TEXT = {
        en: {
          tagline: 'A random episode, never repeated',
          s1: ['A random episode<br><em>in one click</em>', 'Pick a show and let chance decide what you watch.'],
          s2: ['<em>Surprise</em> mode', 'Mix every show you tick into a single shuffle.'],
          s3: ['Never the same<br>episode <em>twice</em>', 'Every episode plays once before any can come back.'],
          s4: ['Catalog synced<br><em>automatically</em>', 'All seasons are fetched for you. New episodes show up on their own.'],
          outro: ['Random episodes,', 'never repeated'],
          kicker: 'Disney+ · Paramount+',
          browsers: 'For Chrome & Firefox',
        },
        fr: {
          tagline: 'Un épisode au hasard, sans répétition',
          s1: ['Un épisode au hasard<br><em>en un clic</em>', 'Choisis une série et laisse le hasard décider.'],
          s2: ['Mode <em>Surprise</em>', 'Mélange toutes les séries cochées dans un seul tirage.'],
          s3: ['Jamais deux fois<br>le <em>même épisode</em>', 'Chaque épisode passe une fois avant de pouvoir revenir.'],
          s4: ['Catalogue synchronisé<br><em>tout seul</em>', 'Toutes les saisons sont récupérées pour toi. Les nouveaux épisodes arrivent seuls.'],
          outro: ['Des épisodes au hasard,', 'sans répétition'],
          kicker: 'Disney+ · Paramount+',
          browsers: 'Pour Chrome et Firefox',
        },
      }[lang];

      const stage = document.getElementById('stage');
      const el = (html, parent = stage) => {
        const t = document.createElement('template');
        t.innerHTML = html.trim();
        return parent.appendChild(t.content.firstElementChild);
      };
      const dots = () => COLORS.map((c) => `<span class="dot" style="background:${c};box-shadow:0 0 10px ${c}"></span>`).join('');

      // ---------- Animation helpers (fonctions pures du temps t) ----------
      const clamp = (x) => Math.min(1, Math.max(0, x));
      const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
      const prog = (t, a, b) => ease((t - a) / (b - a));
      const lerp = (a, b, k) => a + (b - a) * k;
      /** Visible entre a et b, avec un fondu de d secondes à l'entrée et à la sortie. */
      const win = (t, a, b, d = 0.45) => Math.min(prog(t, a, a + d), 1 - prog(t, b - d, b));

      // ---------- Décor ----------
      const glowSpecs = [
        // x, y, r, couleur, opacité ; dérivent lentement avec le temps
        [1000, 160, 320, '#d946ef', 0.45, 40],
        [1150, 640, 260, '#4f46e5', 0.45, -30],
        [100, 680, 240, '#facc15', 0.16, 25],
        [180, 80, 220, '#22c55e', 0.12, -20],
      ];
      const glowEls = glowSpecs.map(([x, y, r, c, o]) =>
        el(`<div class="glow" style="left:${x - r}px;top:${y - r}px;width:${2 * r}px;height:${2 * r}px;background:${c};opacity:${o}"></div>`),
      );
      el('<div class="grain"></div>');

      // ---------- Intro / outro ----------
      const intro = el(`<div class="layer" style="inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px">
        <img src="/store/logo.svg" width="150" height="150" style="filter:drop-shadow(0 0 50px rgba(217,70,239,.75))">
        <div style="font-size:64px;font-weight:800;letter-spacing:-0.03em">RandomWatch</div>
        <div style="font-size:26px;color:#a1a1aa">${TEXT.tagline}</div>
      </div>`);
      const [introLogo, introName, introTag] = intro.children;

      const outro = el(`<div class="layer" style="inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center">
        <div class="brand"><img src="/store/logo.svg" width="84" height="84"><span style="font-size:46px">RandomWatch</span></div>
        <h1 style="font-size:66px">${TEXT.outro[0]}<br><em>${TEXT.outro[1]}</em></h1>
        <div class="kicker" style="align-self:center;font-size:18px;padding:8px 18px">${dots()}<span style="margin-left:4px">${TEXT.kicker} · ${TEXT.browsers}</span></div>
      </div>`);

      // ---------- Textes des scènes ----------
      const SCENES = [
        { key: 's1', a: 3.2, b: 9.6 },
        { key: 's2', a: 9.6, b: 14.6 },
        { key: 's3', a: 14.6, b: 18.6 },
        { key: 's4', a: 18.6, b: 22.6 },
      ];
      for (const s of SCENES) {
        const [title, sub] = TEXT[s.key];
        s.el = el(`<div class="layer" style="left:90px;top:0;bottom:0;width:600px;display:flex;flex-direction:column;justify-content:center;gap:24px">
          <div class="brand"><img src="/store/logo.svg" width="42" height="42"><span style="font-size:22px">RandomWatch</span></div>
          <h1 style="font-size:62px">${title}</h1>
          <p class="sub">${sub}</p>
          <div class="kicker">${dots()}<span style="margin-left:4px">${TEXT.kicker}</span></div>
        </div>`);
      }

      // ---------- Popup réelle (plusieurs états préchargés, en fondu) ----------
      const SCALE = 0.78, FX = 800, POPUP_W = 380;
      const frame = el(`<div class="frame" style="left:${FX}px;width:${POPUP_W * SCALE}px"></div>`);
      const PAUSE = '*,*::before,*::after{animation-play-state:paused!important;transition:none!important}';
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      function loadState(name, state, action) {
        const iframe = el(`<iframe src="/popup.html?lang=${lang}&state=${state}&art=${new URLSearchParams(location.search).get('art') || ''}" style="width:${POPUP_W}px;height:900px;transform:scale(${SCALE})"></iframe>`, frame);
        const ready = new Promise((resolve) => {
          iframe.addEventListener('load', async () => {
            const doc = iframe.contentDocument;
            for (let i = 0; i < 100 && !doc.querySelector('main section'); i++) await wait(50);
            await wait(200);
            if (action) { await action(doc, iframe.contentWindow); await wait(400); }
            const style = doc.createElement('style');
            style.textContent = PAUSE;
            doc.head.append(style);
            await Promise.all([...doc.images].map((im) => (im.complete ? 0 : new Promise((r) => (im.onload = im.onerror = r)))));
            const height = doc.querySelector('main').scrollHeight;
            iframe.style.height = height + 'px';
            resolve({ name, iframe, doc, height });
          });
        });
        return ready;
      }

      const showButton = (doc, win) => {
        const label = win.chrome.i18n.getMessage('randomEpisode');
        return [...doc.querySelectorAll('main section')[0].querySelectorAll('button')].find((b) => b.textContent.includes(label));
      };
      const surpriseButton = (doc) => doc.querySelector('main > button');

      const states = {};
      const cursor = el(`<svg class="layer" width="34" height="34" viewBox="0 0 24 24" style="left:0;top:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))">
        <path d="M4 2 L4 20 L9 15.5 L12.5 22.5 L15.5 21 L12 14 L19 14 Z" fill="#fff" stroke="#18181b" stroke-width="1.4" stroke-linejoin="round"/></svg>`);
      const ripple = el('<div class="ripple"></div>');
      const targets = {};

      window.__ready = (async () => {
        const list = await Promise.all([
          loadState('default', 'default'),
          loadState('show', 'default', async (doc, w) => showButton(doc, w).click()),
          loadState('surprise', 'default', async (doc) => surpriseButton(doc).click()),
          loadState('progress', 'progress'),
          loadState('syncing', 'syncing'),
        ]);
        for (const s of list) states[s.name] = s;
        const H = Math.max(...list.map((s) => s.height)) * SCALE;
        frame.style.height = H + 'px';
        frame.style.top = (720 - H) / 2 + 'px';
        frame.dataset.top = String((720 - H) / 2);

        // Cibles du curseur, en coordonnées de la scène.
        const at = (btn) => {
          const r = btn.getBoundingClientRect();
          return { x: FX + (r.left + r.width * 0.45) * SCALE, y: (720 - H) / 2 + (r.top + r.height * 0.55) * SCALE };
        };
        const def = states.default;
        targets.show = at(showButton(def.doc, def.iframe.contentWindow));
        // Après le clic, le message du tirage décale la liste : le curseur suit son bouton.
        targets.showAfter = at(showButton(states.show.doc, states.show.iframe.contentWindow));
        targets.surprise = at(surpriseButton(def.doc));
        setTime(0);
      })();

      // ---------- Timeline ----------
      const DURATION = 26;
      const CLICK_SHOW = 6.2, CLICK_SURPRISE = 11.8;

      function setTime(t) {
        glowEls.forEach((g, i) => {
          const drift = glowSpecs[i][5];
          g.style.transform = `translate(${Math.sin(t * 0.25 + i) * drift}px, ${Math.cos(t * 0.2 + i) * drift}px)`;
        });

        // Intro
        const ip = prog(t, 0.1, 1.1);
        const iout = 1 - prog(t, 2.6, 3.2);
        intro.style.opacity = iout;
        introLogo.style.transform = `scale(${lerp(0.55, 1, ip)}) rotate(${lerp(-14, 0, ip)}deg)`;
        introLogo.style.opacity = ip;
        introName.style.opacity = prog(t, 0.6, 1.4);
        introName.style.transform = `translateY(${lerp(18, 0, prog(t, 0.6, 1.4))}px)`;
        introTag.style.opacity = prog(t, 1.1, 1.9);
        intro.style.transform = `scale(${lerp(1, 1.06, prog(t, 2.6, 3.2))})`;

        // Textes
        for (const s of SCENES) {
          const v = win(t, s.a, s.b);
          s.el.style.opacity = v;
          s.el.style.transform = `translateY(${(1 - v) * (t < s.a + 1 ? 24 : -24)}px)`;
        }

        // Popup : entrée, sortie, état affiché
        const fin = prog(t, 3.2, 4.1), fout = prog(t, 22.2, 22.8);
        frame.style.opacity = fin * (1 - fout);
        frame.style.transform = `translateX(${lerp(160, 0, fin)}px) scale(${lerp(1, 0.94, fout)})`;
        const opacity = {
          default: 1,
          show: win(t, CLICK_SHOW + 0.15, 9.8, 0.25),
          surprise: win(t, CLICK_SURPRISE + 0.15, 14.8, 0.25),
          progress: win(t, 14.6, 18.8, 0.4),
          syncing: win(t, 18.6, 30, 0.4),
        };
        for (const [name, s] of Object.entries(states)) s.iframe.style.opacity = opacity[name];

        // Curseur : arrive, clique sur la série, puis sur Surprise, puis s'en va
        if (targets.show) {
          const start = { x: 1180, y: 690 };
          let p = start;
          const m1 = prog(t, 4.6, CLICK_SHOW - 0.1);
          p = { x: lerp(start.x, targets.show.x, m1), y: lerp(start.y, targets.show.y, m1) };
          const shift = prog(t, CLICK_SHOW + 0.15, CLICK_SHOW + 0.4);
          p = { x: lerp(p.x, targets.showAfter.x, shift), y: lerp(p.y, targets.showAfter.y, shift) };
          const m2 = prog(t, 10.2, CLICK_SURPRISE - 0.1);
          p = { x: lerp(p.x, targets.surprise.x, m2), y: lerp(p.y, targets.surprise.y, m2) };
          const m3 = prog(t, 12.6, 13.6);
          p = { x: lerp(p.x, 1240, m3), y: lerp(p.y, 740, m3) };
          const press = [CLICK_SHOW, CLICK_SURPRISE].some((c) => t >= c && t < c + 0.15);
          cursor.style.opacity = win(t, 4.4, 13.6, 0.3);
          cursor.style.transform = `translate(${p.x - 6}px, ${p.y - 3}px) scale(${press ? 0.85 : 1})`;

          const click = [CLICK_SHOW, CLICK_SURPRISE].find((c) => t >= c && t < c + 0.6);
          if (click != null) {
            const k = (t - click) / 0.6;
            const r = lerp(6, 46, ease(k));
            const c = click === CLICK_SHOW ? targets.show : targets.surprise; // ripple au point de clic
            Object.assign(ripple.style, { display: 'block', left: c.x - r + 'px', top: c.y - r + 'px', width: 2 * r + 'px', height: 2 * r + 'px', opacity: 0.8 * (1 - k) });
          } else ripple.style.display = 'none';
        }

        // Outro
        const op = prog(t, 22.7, 23.6);
        outro.style.opacity = op;
        outro.style.transform = `scale(${lerp(0.94, 1, op)})`;
      }

      window.DURATION = DURATION;
      window.setTime = setTime;
    </script>
  </body>
</html>
